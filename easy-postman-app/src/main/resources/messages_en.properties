memory_tuning.title=Memory Settings
memory_tuning.content=EasyPostman installers use a 1GB maximum Java heap by default. High-concurrency load tests, disabled Compact Details, many retained failure rows, or large response/message previews can trigger Java heap space.
memory_tuning.when.title=When to Adjust Memory
memory_tuning.when.body=EasyPostman installers use a 1GB maximum Java heap by default. High-concurrency load tests, disabled Compact Details, many retained failure rows, or large response/message previews can trigger Java heap space. First reduce retained result data; if that is still not enough, increase -Xmx and restart.
memory_tuning.recommended.title=Recommended Load-Test Settings
memory_tuning.recommend.compact.title=Compact Details
memory_tuning.recommend.compact.desc=Recommended. In compact mode, the result table keeps the latest 1000 rows by default, which is more stable for long load tests.
memory_tuning.recommend.preview.title=Response Preview
memory_tuning.recommend.preview.desc=Set it to 2KB-4KB. WebSocket/SSE result rows usually need only a last-message preview, not a full large body.
memory_tuning.recommend.row_limit.title=Table Row Limit
memory_tuning.recommend.row_limit.desc=When Compact Details is disabled, more detail is retained, but the table is capped by Settings -> Load Testing -> Result Table Row Limit. Default: {0} rows.
memory_tuning.recommend.failure.title=Failure Details
memory_tuning.recommend.failure.desc=Failed rows retain error, status, sent/received/matched counts, and the last message preview. Keeping a full 64KB body for every row is not recommended.
memory_tuning.xmx.title=How to Increase -Xmx
memory_tuning.platform.mac=macOS
memory_tuning.platform.mac.desc=Right-click EasyPostman.app -> Show Package Contents, edit Contents/app/EasyPostman.cfg, and change -Xmx1g to -Xmx2g or -Xmx4g.
memory_tuning.platform.windows_installer=Windows installer
memory_tuning.platform.windows_installer.desc=Open the installation directory, usually C:\\Program Files\\EasyPostman, edit app\\EasyPostman.cfg, and change -Xmx1g to -Xmx2g or -Xmx4g. Use administrator permissions if needed.
memory_tuning.platform.windows_portable=Windows portable
memory_tuning.platform.windows_portable.desc=Open the extracted EasyPostman\\app directory, edit EasyPostman.cfg, and change -Xmx1g to -Xmx2g or -Xmx4g.
memory_tuning.platform.linux=Linux DEB/RPM
memory_tuning.platform.linux.desc=Open the installation directory, usually /opt/easypostman/lib/app or /opt/EasyPostman/lib/app, edit EasyPostman.cfg, and change -Xmx1g to -Xmx2g or -Xmx4g.
memory_tuning.platform.jar=Direct jar
memory_tuning.platform.jar.desc=Start with: java -Xms256m -Xmx2g -jar easy-postman.jar
memory_tuning.xmx.note=Note: restart the app after editing. Do not set -Xmx close to or above available system memory. Start with 2g; use 4g only when the machine has enough memory.
