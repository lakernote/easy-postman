performance.condition.expression=Expression:
performance.condition.placeholder={{status}} == 200 && defined('token')
performance.condition.description=Runs child nodes only when the expression evaluates to true.\nSupported values: {{variable}}, quoted strings, numbers, true/false.\nSupported operators: ==, !=, >, >=, <, <=, &&, ||, ! and parentheses.\nSupported helper: defined('name') checks whether a variable exists.\nVariables are resolved from the current execution context, including environment/global variables, CSV iteration data, and values set by previous requests or scripts.\nBlank or invalid expressions are treated as false.\nExamples: {{status}} == 200, defined('token') && {{retry}} < 3
performance.while.node=While Controller
performance.while.expression=While Expression:
performance.while.interval=Iteration Interval (ms):
performance.while.timeout=Timeout (ms):
performance.while.max_iterations=Max Iterations:
performance.while.placeholder={{retryCount}} < 3 && {{status}} != 200
performance.while.description=JMeter-style While Controller: before each iteration, evaluates the expression. true runs child nodes and continues; false exits without running another iteration.\nUse interval, timeout, and max iterations as EasyPostman safety limits; set interval to 0 when you do not want an automatic wait between iterations.\nVariables use the same expression syntax as Condition Controller and can come from extractors, scripts, CSV data, environment, or globals.\nBlank or invalid expressions are treated as false, so the loop exits.\nExamples: {{retryCount}} < 3, {{status}} != 200, defined('token') && {{count}} < 10
performance.once_only.node=Once Only
performance.simple.description=Groups child nodes without changing execution count.\nUse it to organize requests, timers, conditions, assertions, extractors, or WebSocket steps.\nChildren run once, in tree order, every time the parent container reaches this controller.\nSimple Controller does not add delay, retry, random selection, or condition logic by itself.\nIn WebSocket requests it can group WS Send/Read/Close steps, but WS Connect still belongs directly under the WebSocket request.
performance.once_only.description=Runs child nodes only once for each virtual user in one run.\nUse it for login, token bootstrap, warm-up request, or other setup work that should not repeat in every loop.\nThe once-only state is shared by iterations of the same virtual user and is reset when a new run starts.\nIt is a request-side controller: place requests, timers, Simple/Loop/Condition children inside it.\nIt does not directly contain bare WebSocket steps; put a WebSocket request under it when setup needs WebSocket traffic.
performance.timer.delay=Delay (ms):
performance.timer.hint=Timers apply before each sampler in their tree scope. In WebSocket scenarios, timers inside WS steps still run in scenario order.
