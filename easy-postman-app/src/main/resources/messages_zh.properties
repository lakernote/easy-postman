memory_tuning.title=内存设置说明
memory_tuning.content=EasyPostman 安装包默认最大 Java 堆内存为 1GB。高并发压测、关闭“精简明细”、保留大量失败明细，或响应体/消息预览过大时，可能出现 Java heap space。
memory_tuning.when.title=什么时候需要调整
memory_tuning.when.body=EasyPostman 安装包默认最大 Java 堆内存为 1GB。高并发压测、关闭“精简明细”、保留大量失败明细，或响应体/消息预览过大时，可能出现 Java heap space。建议先减少结果保留量；仍不够时再调大 -Xmx 并重启。
memory_tuning.recommended.title=压测推荐设置
memory_tuning.recommend.compact.title=精简明细
memory_tuning.recommend.compact.desc=建议开启。精简模式下结果表默认只保留最近 1000 条，长时间压测更稳。
memory_tuning.recommend.preview.title=响应体预览
memory_tuning.recommend.preview.desc=建议调到 2KB-4KB。WebSocket/SSE 结果表通常只需要最后消息预览，不适合保留完整大 body。
memory_tuning.recommend.row_limit.title=结果表上限
memory_tuning.recommend.row_limit.desc=关闭精简明细时仍会保留更多明细，但会按“设置 -> 压力测试 -> 结果表保留上限”裁剪，默认 {0} 条。
memory_tuning.recommend.failure.title=失败行明细
memory_tuning.recommend.failure.desc=失败行只保留错误、状态码、发送/接收/匹配计数和最后消息预览，不建议为每行保留完整 64KB body。
memory_tuning.xmx.title=如何调大 -Xmx
memory_tuning.platform.mac=macOS
memory_tuning.platform.mac.desc=右键 EasyPostman.app -> 显示包内容，编辑 Contents/app/EasyPostman.cfg，将 -Xmx1g 改为 -Xmx2g 或 -Xmx4g。
memory_tuning.platform.windows_installer=Windows 安装版
memory_tuning.platform.windows_installer.desc=进入安装目录，通常是 C:\\Program Files\\EasyPostman，编辑 app\\EasyPostman.cfg，将 -Xmx1g 改为 -Xmx2g 或 -Xmx4g。如无权限，请用管理员权限编辑。
memory_tuning.platform.windows_portable=Windows 便携版
memory_tuning.platform.windows_portable.desc=进入解压目录 EasyPostman\\app，编辑 EasyPostman.cfg，将 -Xmx1g 改为 -Xmx2g 或 -Xmx4g。
memory_tuning.platform.linux=Linux DEB/RPM
memory_tuning.platform.linux.desc=进入安装目录，通常是 /opt/easypostman/lib/app 或 /opt/EasyPostman/lib/app，编辑 EasyPostman.cfg，将 -Xmx1g 改为 -Xmx2g 或 -Xmx4g。
memory_tuning.platform.jar=直接运行 jar
memory_tuning.platform.jar.desc=启动时指定：java -Xms256m -Xmx2g -jar easy-postman.jar
memory_tuning.xmx.note=注意：修改后必须重启应用。不要把 -Xmx 设置得接近或超过机器可用内存；一般先从 2g 开始，需要更大并且机器内存充足时再用 4g。
