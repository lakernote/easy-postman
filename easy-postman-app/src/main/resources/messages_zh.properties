performance.result.detail.compact.disable.warning=确定要关闭精简明细吗？\n\n关闭后结果表会保留全部请求明细，HTTP 响应体也会尽量完整保留，长时间或高并发压测时会显著增加内存占用。\n\n报表统计不受此开关影响，开启精简明细时仍会完整统计总数、成功率、QPS、P90/P95/P99 等指标。\n\n建议高并发压测保持开启。是否仍要关闭？
