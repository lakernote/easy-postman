performance.result.detail.compact.warning.msg=当前压测预计请求数较高（{0}），但未开启精简明细。\n\n关闭精简明细时，结果表会记录全部请求明细，响应体也会尽量保留，可能造成明显内存压力。\n\n报表统计不受影响；开启精简明细后仍会完整统计总数、成功率、QPS、P90/P95/P99 等指标，只是结果表仅保留失败和慢请求详情。\n\n是否现在开启精简明细？
