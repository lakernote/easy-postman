performance.condition.description=仅当表达式计算结果为 true 时执行子节点。\n支持的值：{{变量}}、引号字符串、数字、true/false。\n支持的运算符：==、!=、>、>=、<、<=、&&、||、! 和括号。\n支持的函数：defined('name') 用于判断变量是否存在。\n变量来自当前执行上下文，包括环境/全局变量、CSV 迭代数据，以及前面请求或脚本写入的变量。\n空表达式或非法表达式按 false 处理。\n示例：{{status}} == 200，defined('token') && {{retry}} < 3
performance.while.node=While Controller
performance.while.expression=循环条件:
performance.while.interval=迭代间隔(ms):
performance.while.timeout=超时时间(ms):
performance.while.max_iterations=最大迭代次数:
performance.while.placeholder={{retryCount}} < 3 && {{status}} != 200
performance.while.description=JMeter 风格 While Controller：每轮开始前先计算表达式。true 表示执行子节点并继续下一轮；false 表示退出，不再执行下一轮。\n迭代间隔、超时时间和最大迭代次数是 EasyPostman 的安全限制；不需要自动等待时可把迭代间隔设为 0。\n变量语法与条件控制器一致，可来自提取器、脚本、CSV 数据、环境变量或全局变量。\n空表达式或非法表达式按 false 处理，因此会直接退出循环。\n示例：{{retryCount}} < 3，{{status}} != 200，defined('token') && {{count}} < 10
performance.once_only.node=Once Only
performance.simple.description=只做分组，不改变执行次数。\n适合整理请求、定时器、条件、断言、提取器或 WebSocket 步骤。\n每次父容器执行到该控制器时，子节点按树顺序执行一次。\nSimple Controller 本身不会增加等待、重试、随机选择或条件判断。\n在 WebSocket 请求下可以分组 WS Send/Read/Close 步骤，但 WS Connect 仍应直接放在 WebSocket 请求下。
performance.once_only.description=每个虚拟用户在一次运行中只执行一次子节点。\n适合登录、获取 token、预热请求，或其他不应在每轮循环里重复的准备动作。\n同一虚拟用户的多次迭代共享 once-only 状态；开始新运行时会重置。\n它是请求侧控制器：内部可放请求、定时器、Simple/Loop/Condition 等子节点。\n不直接放裸 WebSocket 步骤；如准备动作需要 WebSocket 流量，请把 WebSocket 请求放到它下面。
