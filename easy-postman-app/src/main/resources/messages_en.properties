performance.csv.usage_note=• In performance testing, CSV Data Set rows are bound to virtual users: the same thread keeps using the same row for the whole test instead of switching rows on every request\n• In remote runs, workers split the GUI-configured total virtual users and CSV rows follow the global virtual-user ranges, so workers do not duplicate from row 0\n• If concurrent users exceed CSV rows, rows are reused cyclically, so account-like datasets should have at least as many rows as concurrent users\n• A CSV Data Set only applies to its Thread Group; multiple Thread Groups can use different CSV files
