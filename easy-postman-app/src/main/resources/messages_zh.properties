performance.csv.usage_note=• 在性能测试中，CSV Data Set 会按虚拟用户绑定：同一个线程在整个测试期间始终使用同一行数据，而不是每次请求都切换到下一行\n• 远程执行时，workers 会按 GUI 配置的总虚拟用户数分摊，CSV 行也跟随全局虚拟用户区间分配，避免每台 worker 从第 0 行重复读取\n• 如果并发用户数大于 CSV 行数，会按行数循环复用，因此账号类数据请确保行数不少于并发用户数\n• CSV Data Set 仅作用于所在 Thread Group；多个 Thread Group 可以分别挂载不同 CSV 文件
