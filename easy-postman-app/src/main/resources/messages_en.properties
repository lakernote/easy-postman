settings.performance.keep_alive.tooltip=Maximum connection keep alive time in seconds
settings.performance.max_requests=Max Concurrent Requests:
settings.performance.max_requests.tooltip=Global concurrency limit for OkHttp's async Dispatcher; ordinary HTTP load tests currently execute synchronously and are not throttled by this value.
settings.performance.max_requests_per_host=Max Concurrent Requests Per Host:
settings.performance.max_requests_per_host.tooltip=Per-host concurrency limit for OkHttp's async Dispatcher; ordinary HTTP load tests currently execute synchronously and are not throttled by this value.
settings.performance.js_context_pool_size=JS Context Pool Size:
settings.performance.js_context_pool_size.tooltip=Maximum number of GraalJS contexts available for concurrent load-test script execution. Start with 4x CPU cores and increase for highly concurrent WebSocket send pre-scripts.
settings.performance.js_context_acquire_timeout=JS Context Acquire Timeout (ms):
settings.performance.js_context_acquire_timeout.tooltip=Maximum time a script execution thread waits for an available JS context. Increase when concurrency is high or scripts are slow to avoid short queueing failures.
settings.performance.slow_request_threshold=Slow Request Threshold (ms, 0=disabled):
settings.performance.slow_request_threshold.tooltip=When Compact Details is enabled, requests exceeding this threshold are logged to the result table (0 means disabled, only failed requests are logged)
settings.performance.response_body_preview_limit=Response Body Preview Limit (KB):
settings.performance.response_body_preview_limit.tooltip=Maximum retained preview size for HTTP response bodies and WebSocket/SSE messages when Compact Details is enabled. Default is 64 KB. Smaller values save more memory, but body assertions, JSONPath, and post-scripts see less content. HTTP requests with no body dependency still retain no response body and only record size.
settings.performance.result_row_limit=Result Table Row Limit (Compact Details off):
settings.performance.result_row_limit.tooltip=Maximum number of recent rows retained by the result table when Compact Details is disabled. Default is 3000. Compact Details mode always keeps the latest 1000 rows to reduce memory usage during long load tests.
settings.performance.trend_sampling=Trend Refresh Interval (seconds):
settings.performance.trend_sampling.tooltip=Controls how often trend chart points and remote worker trend snapshots are refreshed (1-60 seconds). It does not change run duration or final statistics.
settings.performance.event_logging=Enable Event Logging
settings.performance.event_logging.tooltip=Whether to record event logs during performance testing. Enable to view detailed history, but will impact performance (default: disabled)
